install_repository:
  fields:
    repository:
      required: true
      example: "custom-components/sensor"
      selector:
        text:
    category:
      required: false
      default: "integration"
      selector:
        select:
          options:
            - "integration"
            - "plugin"
            - "theme"
            - "appdaemon"
            - "python_script"
            - "netdaemon"
            - "template"

find_entity_refs:
  fields:
    entity_id:
      required: true
      example: "sensor.temperature"
      selector:
        entity: {}

replace_entity_refs:
  fields:
    old_id:
      required: true
      example: "sensor.old_temperature"
      selector:
        entity: {}
    new_id:
      required: true
      example: "sensor.new_temperature"
      selector:
        entity: {}
    preview:
      required: false
      default: true
      selector:
        boolean:
